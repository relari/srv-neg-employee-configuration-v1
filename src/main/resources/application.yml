spring:
  application:
    name: 'srv-neg-employee-configuration-v1'
  profiles.active: local

  jackson:
    default-property-inclusion: non_null

#  config:
#    import: env-dev.yml

  cloud:
    config:
      enabled: false
      uri: ${CLOUD_CONFIG_URL:http://localhost:8888}
#    vault:
#      application:
#        name: ${spring.application.name}
#      scheme: http
#      authentication: TOKEN
#      host: localhost
#      token: 00000000-0000-0000-0000-000000000000
#      port: 8200

application:
  info:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'
  api:
    path: '/srv/neg/v1/employee-configuration'

  errors:
    code: API
    default_code: 'API999'

    # Configuración de canales (opcional)
    channels:
      web:
        prefix: 'EM-WEB'
      api:
        prefix: 'EM-API'
      mobile:
        prefix: 'EM-MOB'
    status:
      # ========================
      # Errores HTTP Genéricos
      # ========================
      BAD_REQUEST:
        description: 'Solicitud inválida o incorrecta.'
        status: 400
      UNAUTHORIZED:
        description: 'Autenticación requerida.'
        status: 401
      FORBIDDEN:
        description: 'Acceso denegado.'
        status: 403
      NOT_FOUND:
        description: 'Recurso no encontrado.'
        status: 404
      CONFLICT:
        description: 'Conflicto con el estado actual del recurso.'
        status: 409
      INTERNAL_SERVER_ERROR:
        description: 'Error interno del servidor.'
        status: 500
    categories:
      # ========================
      # Errores de Empleado
      # ========================
      EMPLOYEE_NOT_FOUND:
        code: 'EM002'              # Código por defecto
        description: 'Empleado no encontrado.'
        status_code: NOT_FOUND
        # Códigos alternativos por canal (opcional)
        code_web: 'EM-WEB-002'
        code_api: 'EM-API-002'
        code_mobile: 'EM-MOB-002'

      EMPLOYEE_SAVE_FAILED:
        code: 'EM001'
        description: 'Error al guardar al empleado.'
        status_code: INTERNAL_SERVER_ERROR

      EMPLOYEE_UPDATE_FAILED:
        code: 'EM003'
        description: 'Error al actualizar al empleado.'
        status_code: INTERNAL_SERVER_ERROR

      EMPLOYEE_INACTIVATED:
        code: 'EM004'
        description: 'Empleado inactivado.'
        status_code: CONFLICT

      EMPLOYEE_ACTIVATED:
        code: 'EM005'
        description: 'Empleado activado.'
        status_code: CONFLICT

      # ========================
      # Errores de Documento
      # ========================
      DOCUMENT_NOT_FOUND:
        code: 'EM006'
        description: 'Documento no encontrado.'
        status_code: NOT_FOUND

      DOCUMENT_REGISTERED:
        code: 'EM007'
        description: 'Documento registrado.'
        status_code: CONFLICT

server:
  port: ${APP_PORT:8081}
  error:
    include-message: always

springdoc:
  api-docs:
    path: '${application.api.path}/openapi'

  swagger-ui:
    path: '${application.api.path}/swagger-ui.html'

eureka:
  instance:
    instance-id: ${spring.application.name}:@project.version@
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8084/eureka/}

management:
  endpoints:
    web:
      base-path: ${application.api.path}/actuator
      exposure:
        include: health,info,prometheus,loggers
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

info:
  app:
    name: '${spring.application.name}'
    description: '${application.info.description}'
    version: '${application.info.version}'

logging:
  level:
    pe.com.relari.srv_neg_employee_configuration_v1: TRACE
    pe.com.relari.fwk.spring.reactive.handler.error.handler: TRACE
